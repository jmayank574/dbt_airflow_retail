[project]
name = "data-dbt"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "Mayank Joshi", email = "jmayank574@gmail.com" }
]
requires-python = ">=3.13"
dependencies = [
    "dbt-core>=1.12.3",
    "dbt-databricks>=1.10.9",
]

[project.scripts]
data-dbt = "data_dbt:main"

[build-system]
requires = ["uv_build>=0.12.7,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "shandy-sqlfmt>=0.32.0",
]
